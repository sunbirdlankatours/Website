# Rebuilds and publishes the website every time a change is saved (pushed).
#  - Cloudflare Pages: the real site (sunbirdtours.lk). A push to main goes live; a push to any other branch
#    gets its own private preview address, so unfinished work can be checked first. This part only runs once
#    the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are added (README → "Publish on Cloudflare").
#  - GitHub Pages: the old test address (sunbirdlankatours.github.io/Website/), main only, until the
#    repository is made private.
name: Publish website

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: sunbirdtours
    steps:
      - name: Cloudflare isn't connected yet
        if: env.HAS_CF != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so only the GitHub test address was updated."
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_CF == 'true'
        with:
          python-version: "3.12"
      - name: Install the photo tool
        if: env.HAS_CF == 'true'
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: env.HAS_CF == 'true'
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('static/img/**') }}
          restore-keys: photos-
      # built for the top of the domain (no sub-folder), as sunbirdtours.lk needs
      - name: Build the site
        if: env.HAS_CF == 'true'
        run: python build.py
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: "22"
      # makes the Cloudflare Pages project the first time (later runs just find it there)
      - name: Make sure the Cloudflare project exists
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
      - name: Send the site to Cloudflare
        if: env.HAS_CF == 'true'
        run: npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA"

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tells the build where the site lives: "/Website" on sunbirdlankatours.github.io/Website/
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow makes the smaller WebP copies of the photos (phones download phone-sized photos)
      - name: Install the photo tool
        run: pip install -r requirements.txt
      # keep the photo copies between builds, so only new or changed photos take time
      - uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('static/img/**') }}
          restore-keys: photos-
      - name: Build the site
        run: python build.py
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
