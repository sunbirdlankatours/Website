# Rebuilds the website and sends it to Cloudflare Pages every time a change is saved (pushed).
# A push to main goes live on sunbirdtours.lk; a push to any other branch gets its own preview
# address (….sunbirdtours.pages.dev), so unfinished work can be checked first.
# It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README → "Publish on Cloudflare Pages").
name: Publish website

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: sunbirdtours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow makes the smaller WebP copies of the photos (phones download phone-sized photos)
      - name: Install the photo tool
        run: pip install -r requirements.txt
      # keep the photo copies between builds, so only new or changed photos take time
      - uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('static/img/**') }}
          restore-keys: photos-
      - name: Build the site
        run: python build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # makes the Cloudflare Pages project if it's ever missing (normally it's already there)
      - name: Make sure the Cloudflare project exists
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
      - name: Send the site to Cloudflare
        run: npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT" --branch="$GITHUB_REF_NAME" --commit-hash="$GITHUB_SHA"
