# The Sunbird inquiry box (src/index.js), a Cloudflare Worker. README.md → "The inquiry box" explains it.
# Send a new version to Cloudflare from this folder with:  npx wrangler deploy
# Try it on this computer with:  npx wrangler dev --var SETUP_CODE:try-it-out
name = "green-sea-c14dsunbird-inquiries"
main = "src/index.js"
compatibility_date = "2026-05-01"
workers_dev = true
preview_urls = false

[observability]
enabled = true

# the website's files, which the admin panel edits through the Worker (the GITHUB_TOKEN secret)
[vars]
GITHUB_REPO = "sunbirdlankatours/Website"
GITHUB_BRANCH = "main"

[[d1_databases]]
binding = "DB"
database_name = "sunbird-inquiries"
database_id = "85f119bf-43d2-4802-a973-9815f1638f42"

# the live chat's doorbell (src/desk.js): holds the open live lines, so messages arrive at once
[[durable_objects.bindings]]
name = "DESK"
class_name = "Desk"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Desk"]

# each new letter from the website is emailed to the team's Gmail too (src/mail.js). Cloudflare only sends to a
# verified address: Email → Email Routing → Destination addresses (sunbirdlankatours@gmail.com is verified).
[[send_email]]
name = "MAILER"
destination_address = "sunbirdlankatours@gmail.com"

# Secrets, added in Cloudflare (never written here): SETUP_CODE, GITHUB_TOKEN, and FCM_SERVICE_ACCOUNT
# (the Firebase key that rings the team's phones for chats, see src/ring.js).
